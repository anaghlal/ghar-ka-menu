<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5531a">
<title>Ghar Ka Menu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Ghar Ka Menu</div>
  <div class="row" style="gap:4px"><button id="syncBtn" class="sync" aria-label="Sync status">●</button>
  <a class="btn" href="help.html" aria-label="Help" style="min-height:32px;padding:4px 12px;text-decoration:none;color:var(--acc);font-weight:700">?</a></div>
</header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" role="tablist">
  <button data-act="tab" data-tab="today" class="on">Today</button>
  <button data-act="tab" data-tab="week">Week</button>
  <button data-act="tab" data-tab="shop">Shopping</button>
  <button data-act="tab" data-tab="recipes">Recipes</button>
  <button data-act="tab" data-tab="settings">Settings</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
